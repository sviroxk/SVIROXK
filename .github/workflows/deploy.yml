name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Pages metadata and links
        run: npm run check:pages
      - name: Check visual registries
        run: npm run check:visuals
      - name: Typecheck and production build
        run: npm run build
        env:
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT || 'https://formsubmit.co/ajax/sviroxk@gmail.com' }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL || 'sviroxk@gmail.com' }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright end-to-end tests
        run: npm run test:e2e
        env:
          CI: true
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT || 'https://formsubmit.co/ajax/sviroxk@gmail.com' }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL || 'sviroxk@gmail.com' }}
      - name: Validate GitHub Pages site metadata
        run: node scripts/check-pages-metadata.mjs
      - name: Generate repository-specific route metadata
        run: node scripts/render-routes.mjs
      - name: Generate repository-specific robots.txt and sitemap.xml
        run: node scripts/prepare-pages.mjs
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
